<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی Sheep — موقتاً تعطیل</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Tahoma, 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #0d2818 0%, #123524 55%, #0d2818 100%);
    color: #eaf5ec;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 40px 28px;
  }
  .sheep { font-size: 84px; line-height: 1.1; }
  h1 { font-size: 24px; margin: 18px 0 12px; color: #ffd94d; }
  p { font-size: 16px; line-height: 2; color: #cfe6d4; }
  .small { font-size: 13px; color: #9dbfa6; margin-top: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="sheep">🐑</div>
    <h1>بازی Sheep موقتاً تعطیله</h1>
    <p>بازی فعلاً برای مدتی متوقفه.<br>امتیازهایی که تو ربات ثبت شده، سر جاشون محفوظه و چیزی از بین نمی‌ره.</p>
    <p class="small">ممنون از همراهی‌تون 🙏</p>
  </div>
</body>
</html>
